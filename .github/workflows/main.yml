name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
      - name: Add Android
        run: npx cap add android
      - name: App icon
        run: |
          for d in android/app/src/main/res/mipmap-*; do
            case "$d" in
              *anydpi*) rm -f "$d/ic_launcher.xml" "$d/ic_launcher_round.xml" ;;
              *) cp icon.png "$d/ic_launcher.png"; cp icon.png "$d/ic_launcher_round.png" ;;
            esac
          done
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ball-sort-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
